version: "dev"
port: 8080
database_url: "postgres://localhost:5432/outerstellar?sslmode=require"
dev_dashboard_enabled: false
dev_mode: false
session_cookie_secure: true
session_timeout_minutes: 30
max_failed_login_attempts: 10
lockout_duration_seconds: 900
cors_origins: "https://localhost:8080"
csrf_enabled: true
app_base_url: "https://localhost:8080"
csp_policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' wss:; img-src 'self' data:;"
metrics_token: ""

jwt:
  enabled: false
  secret: ""
  issuer: "outerstellar"
  expiry_seconds: 86400

email:
  enabled: false
  host: "localhost"
  port: 587
  username: ""
  password: ""
  from: "noreply@example.com"
  starttls: true

segment:
  write_key: ""
  enabled: false
