<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse the Outerstellar Platform HTTP API contract.">
    <title>API Documentation - Outerstellar Platform</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/openapi.css">
</head>
<body class="api-docs-body">
    <header class="api-docs-header">
        <a class="api-docs-brand" href="/">Outerstellar</a>
        <a class="api-docs-home" href="/">Return to application</a>
    </header>
    <main class="api-docs-main">
        <section class="api-docs-intro" aria-labelledby="api-docs-title">
            <p class="api-docs-kicker">Contract surface</p>
            <h1 id="api-docs-title">Platform API</h1>
            <p id="api-docs-description">Loading the current server contract…</p>
            <div class="api-docs-meta" aria-label="API summary">
                <span><strong id="api-docs-version">—</strong> version</span>
                <span><strong id="api-docs-path-count">—</strong> paths</span>
                <span><strong id="api-docs-operation-count">—</strong> operations</span>
            </div>
        </section>

        <section class="api-docs-catalog" aria-labelledby="api-docs-catalog-title">
            <div class="api-docs-catalog-heading">
                <div>
                    <p class="api-docs-kicker">Live specification</p>
                    <h2 id="api-docs-catalog-title">Endpoints</h2>
                </div>
                <a class="api-docs-raw" href="/openapi.json">View raw OpenAPI JSON</a>
            </div>
            <p id="api-docs-status" class="api-docs-status" role="status">Reading /openapi.json</p>
            <div id="api-docs-endpoints" class="api-docs-endpoints"></div>
            <noscript>
                <p class="api-docs-error">JavaScript is required for the endpoint catalog. The raw OpenAPI document remains available above.</p>
            </noscript>
        </section>
    </main>
    <script src="/static/js/openapi.js"></script>
</body>
</html>
