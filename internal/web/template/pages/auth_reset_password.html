{{ define "content" }}
<div class="auth-page">
    <div class="auth-card">
        <h1>{{ translate .Language "web.reset.title" }}</h1>
        <p>{{ translate .Language "web.auth.recover.description" }}</p>
        {{ if .BodyData.Error }}
        <div class="toast toast-error">{{ .BodyData.Error }}</div>
        {{ end }}
        <form method="POST" action="/auth/reset">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <div class="form-group">
                <label for="email">{{ translate .Language "web.auth.field.email" }}</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.auth.recover.submit" }}</button>
        </form>
    </div>
</div>
{{ end }}
