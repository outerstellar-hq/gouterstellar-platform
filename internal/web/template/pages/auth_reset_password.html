{{ define "content" }}
<div class="auth-page"><div class="auth-card">
    <h1>Reset Password</h1>
    {{ if .Error }}<div class="toast toast-error" role="alert">{{ .Error }}</div>{{ end }}
    <p>Enter your account email. If it matches an account, reset instructions will be sent.</p>
    <form method="POST" action="/auth/reset">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
        <button type="submit" class="btn btn-primary">Send Reset Instructions</button>
    </form>
    <p><a href="/auth">Return to sign in</a></p>
</div></div>
{{ end }}
