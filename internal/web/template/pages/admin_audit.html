{{ define "content" }}
<div class="admin-audit-page">
    <div class="page-header">
        <h1>Audit Log</h1>
		<div class="export-actions" aria-label="Export audit log">
			<a href="/admin/audit/export" class="btn btn-sm btn-secondary" download>CSV</a>
			<a href="/admin/audit/export/json" class="btn btn-sm btn-secondary" download>JSON</a>
		</div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Time</th>
                <th>Actor</th>
                <th>Target</th>
                <th>Action</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody>
            {{ range .BodyData.Entries }}
            <tr>
                <td>{{ .CreatedAt }}</td>
                <td>{{ .ActorUsername }}</td>
                <td>{{ .TargetUsername }}</td>
                <td><span class="badge">{{ .Action }}</span></td>
                <td>{{ .Detail }}</td>
            </tr>
            {{ else }}
            <tr><td colspan="5" class="empty-state">No audit entries found.</td></tr>
            {{ end }}
        </tbody>
    </table>

    {{ template "pagination" .BodyData.Pagination }}
</div>
{{ end }}
