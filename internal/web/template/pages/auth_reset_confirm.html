{{ define "content" }}
<div class="auth-page">
    <div class="auth-card">
        <h1>{{ translate .Language "web.reset.title" }}</h1>
        <p>{{ translate .Language "web.reset.new.description" }}</p>
        {{ if .BodyData.Error }}
        <div class="toast toast-error">{{ .BodyData.Error }}</div>
        {{ end }}
        <form method="POST" action="/auth/reset/confirm">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <input type="hidden" name="token" value="{{ .BodyData.ReturnTo }}">
            <div class="form-group">
                <label for="new_password">{{ translate .Language "web.reset.newPassword" }}</label>
                <input type="password" id="new_password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="reset-password-requirements" required>
                <p id="reset-password-requirements">{{ translate .Language "web.password.requirements" }}</p>
            </div>
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.reset.submit" }}</button>
        </form>
    </div>
</div>
{{ end }}
