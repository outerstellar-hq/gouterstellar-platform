{{ define "content" }}
<div class="contacts-page">
    <div class="page-header">
        <h1>{{ translate .Language "web.nav.contacts" }}</h1>
        <form method="GET" action="/contacts" class="search-form">
            <input type="text" name="q" value="{{ .BodyData.Query }}" placeholder="{{ translate .Language "web.search.placeholder" }}">
            <button type="submit">{{ translate .Language "web.search.label" }}</button>
        </form>
    </div>

    <details class="contact-create">
        <summary>{{ translate .Language "web.contacts.create" }}</summary>
        <form method="POST" action="/contacts" class="contact-form">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <div class="form-group">
                <label for="contact-name">{{ translate .Language "web.contacts.form.name" }}</label>
                <input type="text" id="contact-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="contact-email">{{ translate .Language "web.contacts.form.emails" }}</label>
                <input type="email" id="contact-email" name="emails">
            </div>
            <div class="form-group">
                <label for="contact-phone">{{ translate .Language "web.contacts.form.phones" }}</label>
                <input type="text" id="contact-phone" name="phones">
            </div>
			<div class="form-group">
				<label for="contact-social">{{ translate .Language "web.contacts.form.social" }}</label>
				<input type="text" id="contact-social" name="socialMedia">
			</div>
            <div class="form-group">
                <label for="contact-company">{{ translate .Language "web.contacts.form.company" }}</label>
                <input type="text" id="contact-company" name="company">
            </div>
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.contacts.form.save" }}</button>
        </form>
    </details>

    {{ template "contact_list" .BodyData }}
</div>
{{ end }}
