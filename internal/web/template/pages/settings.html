{{ define "content" }}
<div class="settings-page">
    <h1>Settings</h1>

    <div class="settings-section">
        <h2>Profile</h2>
        <form method="POST" action="/settings/profile">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ .Profile.Username }}" readonly>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ .Profile.Email }}">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="email_notifications" {{ if .Profile.EmailNotificationsEnabled }}checked{{ end }}>
                    Email notifications
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="push_notifications" {{ if .Profile.PushNotificationsEnabled }}checked{{ end }}>
                    Push notifications
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
        </form>
    </div>

    <div class="settings-section">
        <h2>Preferences</h2>
        <form method="POST" action="/settings/preferences">
            <div class="form-group">
                <label for="theme">Theme</label>
                <select id="theme" name="theme">
                    <option value="light" {{ if eq .Theme "light" }}selected{{ end }}>Light</option>
                    <option value="dark" {{ if eq .Theme "dark" }}selected{{ end }}>Dark</option>
                    <option value="auto" {{ if eq .Theme "auto" }}selected{{ end }}>Auto</option>
                </select>
            </div>
            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" value="{{ .Language }}">
            </div>
            <button type="submit" class="btn btn-primary">Save Preferences</button>
        </form>
    </div>

    <div class="settings-section">
        <h2>API Keys</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Key</th>
                    <th>Created</th>
                    <th>Last Used</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {{ range .ApiKeys }}
                <tr>
                    <td>{{ .Name }}</td>
                    <td><code>{{ .KeyPrefix }}...</code></td>
                    <td>{{ .CreatedAt }}</td>
                    <td>{{ .LastUsed }}</td>
                    <td>
                        <form method="POST" action="/settings/api-keys/{{ .ID }}/revoke">
                            <button type="submit" class="btn btn-sm btn-danger">Revoke</button>
                        </form>
                    </td>
                </tr>
                {{ else }}
                <tr><td colspan="5" class="empty-state">No API keys.</td></tr>
                {{ end }}
            </tbody>
        </table>
        <form method="POST" action="/settings/api-keys" class="inline-form">
            <input type="text" name="name" placeholder="Key name" required>
            <button type="submit" class="btn btn-primary">Create API Key</button>
        </form>
    </div>
</div>
{{ end }}
