{{ define "content" }}
<div class="message-edit-page">
    <div class="page-header">
        <div>
            <p class="form-eyebrow">Message</p>
            <h1>Edit message</h1>
        </div>
        <a href="/messages" class="btn btn-secondary">Cancel</a>
    </div>

    <form method="POST" action="/messages/{{ .BodyData.SyncID }}/update" class="message-edit-card">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        {{ if .BodyData.Error }}<div class="form-error" role="alert">{{ .BodyData.Error }}</div>{{ end }}
        <div class="form-group">
            <label for="message-edit-author">Author</label>
            <input type="text" id="message-edit-author" name="author" value="{{ .BodyData.Author }}" autocomplete="name" required autofocus>
        </div>
        <div class="form-group">
            <label for="message-edit-content">Content</label>
            <textarea id="message-edit-content" name="content" rows="7" required>{{ .BodyData.Content }}</textarea>
        </div>
        <div class="form-actions">
            <a href="/messages" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>
{{ end }}
