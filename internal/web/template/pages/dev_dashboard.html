{{ define "content" }}
<div class="page-header">
    <h1>{{ translate .Language "web.dev.heading" }}</h1>
</div>
<div class="card-grid">
    <div class="card">
        <h2>{{ translate .Language "web.dev.outbox" }}</h2>
        <form method="POST" action="/admin/dev/outbox/process">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.dev.outbox.process" }}</button>
        </form>
    </div>
    <div class="card">
        <h2>{{ translate .Language "web.settings.sessions" }}</h2>
        <form method="POST" action="/admin/dev/sessions/cleanup">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.dev.sessions.cleanup" }}</button>
        </form>
    </div>
    <div class="card">
        <h2>{{ translate .Language "web.dev.cache" }}</h2>
        <form method="POST" action="/admin/dev/cache/invalidate">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.dev.cache.invalidate" }}</button>
        </form>
    </div>
</div>
{{ end }}
