{{ define "content" }}
<div class="home-page">
    <h1>Welcome to Outerstellar Platform</h1>
    <div class="stat-cards">
        <a class="stat-card" href="/messages"><span class="stat-value">{{ .MessageCount }}</span><span class="stat-label">Messages</span></a>
        <a class="stat-card" href="/contacts"><span class="stat-value">{{ .ContactCount }}</span><span class="stat-label">Contacts</span></a>
        <div class="stat-card"><span class="stat-value">{{ .UserCount }}</span><span class="stat-label">Users</span></div>
    </div>
</div>
{{ end }}
