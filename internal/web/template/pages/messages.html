{{ define "content" }}
<div class="messages-page">
    <div class="page-header">
        <h1>Messages</h1>
        <form method="GET" action="/messages" class="search-form">
            <input type="text" name="q" value="{{ .BodyData.Query }}" placeholder="Search messages...">
            <button type="submit">Search</button>
        </form>
    </div>

    {{ if .BodyData.Years }}
    <div class="year-filter">
        <span>Filter by year:</span>
        {{ range .BodyData.Years }}
        <a href="/messages?year={{ . }}{{ if $.BodyData.Query }}&q={{ $.BodyData.Query }}{{ end }}"
           class="year-link{{ if eq . $.BodyData.Year }} active{{ end }}">{{ . }}</a>
        {{ end }}
    </div>
    {{ end }}

    <div class="message-list">
        {{ range .BodyData.Messages }}
        {{ template "message_row" . }}
        {{ else }}
        <p class="empty-state">No messages found.</p>
        {{ end }}
    </div>

    {{ template "pagination" .BodyData.Pagination }}
</div>
{{ end }}
