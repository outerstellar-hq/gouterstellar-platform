{{ define "content" }}
<div class="messages-page">
    <div class="page-header">
        <h1>Messages</h1>
        <form method="GET" action="/messages" class="search-form">
            <input type="text" name="q" value="{{ .Query }}" placeholder="Search messages...">
            <button type="submit">Search</button>
        </form>
    </div>

    <section class="card" aria-labelledby="new-message-title">
        <h2 id="new-message-title">New message</h2>
        <form method="POST" action="/messages">
            <div class="form-group">
                <label for="message-author">Author</label>
                <input id="message-author" name="author" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="message-content">Message</label>
                <textarea id="message-content" name="content" required maxlength="500"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Add message</button>
        </form>
    </section>

    {{ if .Years }}
    <div class="year-filter">
        <span>Filter by year:</span>
        {{ range .Years }}
        <a href="/messages?year={{ . }}{{ if $.Query }}&q={{ $.Query }}{{ end }}"
           class="year-link{{ if eq . $.Year }} active{{ end }}">{{ . }}</a>
        {{ end }}
    </div>
    {{ end }}

    <div class="message-list">
        {{ range .Messages }}
        {{ template "message_row" . }}
        {{ else }}
        <p class="empty-state">No messages found.</p>
        {{ end }}
    </div>

    {{ template "pagination" .Pagination }}
</div>
{{ end }}
