{{ define "content" }}
<div class="auth-page"><div class="auth-card">
    <h1>Change Password</h1>
    {{ if .Error }}<div class="toast toast-error" role="alert">{{ .Error }}</div>{{ end }}
    <form method="POST" action="/auth/change-password">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        <div class="form-group"><label for="currentPassword">Current password</label><input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required></div>
        <div class="form-group"><label for="newPassword">New password</label><input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required></div>
        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
</div></div>
{{ end }}
