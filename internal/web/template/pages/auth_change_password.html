{{ define "content" }}
<div class="auth-page">
    <div class="auth-card">
        <h1>{{ translate .Language "web.password.title" }}</h1>
        {{ if .BodyData.Error }}
        <div class="toast toast-error">{{ .BodyData.Error }}</div>
        {{ end }}
        <form method="POST" action="/auth/change-password">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <div class="form-group">
                <label for="current_password">{{ translate .Language "web.password.current" }}</label>
                <input type="password" id="current_password" name="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="new_password">{{ translate .Language "web.password.new" }}</label>
                <input type="password" id="new_password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="change-password-requirements" required>
                <p id="change-password-requirements">{{ translate .Language "web.password.requirements" }}</p>
            </div>
            <div class="form-group">
                <label for="confirm_password">{{ translate .Language "web.password.confirm" }}</label>
                <input type="password" id="confirm_password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ translate .Language "web.password.submit" }}</button>
        </form>
    </div>
</div>
{{ end }}
