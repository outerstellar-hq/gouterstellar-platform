{{ define "contact_trash_list" }}
<div class="contact-list trash-list">
    {{ range .Contacts }}
    <article class="contact-row trash-row">
        <div class="trash-contact-body">
            <strong>{{ .Name }}</strong>
            {{ if .Company }}<span>{{ .Company }}</span>{{ end }}
            {{ range .Emails }}<span>{{ . }}</span>{{ end }}
        </div>
        <form method="POST" action="/contacts/{{ .SyncID }}/restore" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <button type="submit" class="btn btn-sm">{{ translate .Language "web.contacts.restore" }}</button>
        </form>
    </article>
    {{ else }}
    <p class="empty-state">{{ translate .Language "web.trash.contacts.empty" }}</p>
    {{ end }}
</div>
{{ end }}
