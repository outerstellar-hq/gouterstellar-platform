name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependency checksums
        run: go mod verify

      - name: Check module files
        run: go mod tidy -diff

      - name: Verify library-only boundary
        shell: bash
        run: |
          if [[ -n "$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)" ]]; then
            echo "Executable packages are not allowed in this library repository."
            exit 1
          fi
          for forbidden in cmd internal extensions platform config static queries Dockerfile compose.yaml; do
            if [[ -e "$forbidden" ]]; then
              echo "Forbidden application-host path: $forbidden"
              exit 1
            fi
          done
          product_pattern='star''forge|star''line'
          if git grep -n -i -E "$product_pattern" -- .; then
            echo "Product-specific references are not allowed."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -parallel=4 -timeout=10m
