name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          package="gouterstellar-platform_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          package_dir="dist/${package}"
          executable_suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            executable_suffix=".exe"
          fi

          mkdir -p "${package_dir}"
          go build -trimpath -ldflags="-s -w" -o "${package_dir}/server${executable_suffix}" ./cmd/server
          go build -trimpath -ldflags="-s -w" -o "${package_dir}/migrate${executable_suffix}" ./cmd/migrate
          go build -trimpath -ldflags="-s -w" -o "${package_dir}/seed${executable_suffix}" ./cmd/seed
          cp -R config static README.md LICENSE "${package_dir}/"
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME}\"/" "${package_dir}/config/application.yaml"

          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist && zip -qr "${package}.zip" "${package}")
            archive="${package}.zip"
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
            archive="${package}.tar.gz"
          fi

          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          rm -rf "${package_dir}"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
