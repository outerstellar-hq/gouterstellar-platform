version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: gomod
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
